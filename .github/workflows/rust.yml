name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v27
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
    - name: Flake check
      run: nix flake check --print-build-logs
    - name: Build package
      run: nix build .#watsup --print-build-logs
    - name: Run tests
      run: nix develop --print-build-logs --command cargo test --verbose
